      <div class="flex w-full items-center justify-between text-[15px] font-black">
        <a class="inline-flex items-center gap-2" href="#"><svg class="size-7 fill-brand" viewBox="0 0 1024.5 1024.5" aria-hidden="true"><use href="#empo-mark" /></svg>Empo</a>
        <nav class="flex gap-5" aria-label="Site"><a href="https://mateo-m.github.io/empo-app/">Docs</a><a href="https://github.com/mateo-m/empo-app">GitHub</a><a href="https://discord.gg/m3YnpXMxrB">Discord</a></nav>
      </div>

      <div class="flex flex-col items-center gap-2">
        <h1 class="text-[clamp(64px,10vw,120px)] leading-none font-black tracking-[-0.04em] text-brand">Empo</h1>
        <div class="w-[min(260px,21svh)] rounded-[36px] bg-ink p-2">
          <img class="block aspect-[1206/2622] w-full rounded-[28px] object-cover" src="../media/demo-battle.png" alt="A battle scene from an RPG Maker game running in Empo." width="1206" height="2622" />
        </div>
      </div>

      <div class="grid w-full gap-3 md:grid-cols-[1fr_auto]">
        <div class="rm-window relative flex min-h-[132px] flex-col gap-2 px-6 py-5 text-lg">
          <p class="text-[14px] font-black tracking-[0.08em] text-brand uppercase">Empo</p>
          <p>Your RPG Maker games, on your iPhone. Import a folder or a zip and tap play.<br />XP, VX, VX Ace, and Pokemon Essentials.</p>
          <svg class="absolute right-4 bottom-3 size-3 animate-nudge fill-white motion-reduce:animate-none" viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0h10L5 6z" /></svg>
        </div>
        <ul class="rm-window flex flex-col justify-center gap-2 px-6 py-5 text-lg" aria-label="Choices">
          <li class="flex items-center gap-3"><svg class="size-4 px fill-brand" viewBox="0 0 16 16" aria-hidden="true"><use href="#px-diamond" /></svg><a class="text-brand" href="https://github.com/mateo-m/empo-app/releases">Download the IPA</a></li>
          <li class="pl-7 text-white/85"><a href="https://mateo-m.github.io/empo-app/install">How to install</a></li>
        </ul>
      </div>

      <p class="text-[13px] text-ink/70">Sideload with AltStore or SideStore. iOS 26 or newer. GPLv2+. <a class="underline" href="https://mateo-m.github.io/empo-app/privacy">Privacy</a> · <a class="underline" href="https://mateo-m.github.io/empo-app/terms">Terms</a></p>
    </main>
