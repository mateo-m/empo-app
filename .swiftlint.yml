# SwiftLint config. Pairs with swift-format (which handles
# whitespace + structural formatting). SwiftLint here covers
# style + correctness rules that swift-format does not.

included:
  - ios/Empo/src

excluded:
  - ios/Empo/build
  - ios/Empo/Empo.xcodeproj
  - ios/Empo/src/App/GitInfo.generated.swift

disabled_rules:
  # Length rules disabled. Swift-format already enforces line
  # length and our existing files have long but readable
  # functions / types we don't want to chop arbitrarily.
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - function_parameter_count
  - large_tuple
  - cyclomatic_complexity

  # Naming rules disabled. We have legacy enum cases like
  # `gameQuit` and bridge identifiers like `mkxp_*` that don't
  # match Swift conventions but are intentional.
  - identifier_name
  - type_name

  # `// TODO:` is fine. We already have a TODO.md.
  - todo

  # Trailing whitespace handled by swift-format.
  - trailing_whitespace
  - trailing_newline

  # Whitespace + brace placement handled by swift-format. Disabling
  # in swiftlint avoids contradictions where swift-format adds a
  # trailing comma, wraps a brace, or breaks a long signature
  # over multiple lines and swiftlint flags it.
  - trailing_comma
  - opening_brace
  - closure_parameter_position

  # Force casts / unwraps come up in iOS bridge code. Rely on
  # code review instead of a blanket lint failure.
  - force_cast
  - force_try

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - toggle_bool

# Suppress rules that report on existing code idioms we want to
# keep. These can be re-enabled selectively after a focused
# cleanup pass.
analyzer_rules: []

reporter: "github-actions-logging"

custom_rules:
  # SPEC 10.1: every UserDefaults key carries a backup class, and a
  # key with no class must not ship. A class comes from
  # `PreferenceKeys` in GameProbe, where `swift test` reads the
  # table. A raw string here would skip that table, so it fails the
  # lint.
  preference_class_required:
    included: ".*/App/DefaultsKey\\.swift"
    name: "Preference class required"
    regex: 'static let [a-zA-Z]+ *= *"'
    message: "Name the key in PreferenceKeys with its backup class, per SPEC 10.1."
    severity: error
