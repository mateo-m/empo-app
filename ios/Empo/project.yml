name: Empo
packages:
  GameProbe:
    path: ../GameProbe
  # PKCE for the OAuth providers of SPEC 9.2 and 9.3. Empo hand-rolls
  # the REST of each service, because a second SDK would bring a
  # second background URLSession beside Empo's own. AppAuth stays the
  # proven part and handles the authorization code exchange.
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS.git
    from: 1.7.6
  # The causal history and the merge of SPEC 10. Ticket 22 proved
  # 0.7.2 on an iPhone 13 Pro: a 100,000-mutation document saved to
  # 52,225 bytes, a median load took 64.87 ms, a two-branch merge
  # took 23.89 ms, and the signed app-thinned payload grew by 1.35
  # MiB compressed. Empo supplies the replication over its own
  # targets, so `automerge-repo-swift` stays out.
  Automerge:
    url: https://github.com/automerge/automerge-swift.git
    exactVersion: 0.7.2
options:
  bundleIdPrefix: sh.mateo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.7.0
    CURRENT_PROJECT_VERSION: 704
    # The Dropbox app key of SPEC 9.2. A PKCE client holds no secret,
    # so the key is public and lives here. It builds the callback
    # scheme `db-<key>` in Info.plist. An empty key hides Dropbox from
    # the add flow at runtime, the same way 9.1 gates iCloud Drive.
    DROPBOX_APP_KEY: fhropb11pgietj1
    # The Google Drive OAuth client id of SPEC 9.3. A PKCE client
    # holds no secret, so the id is public and lives here. Google
    # gives an iOS client the reversed form of its own id, and
    # Info.plist registers that as the callback scheme. An empty id
    # hides Google Drive from the add flow at runtime.
    #
    # The checklist to fill it is in 9.3: create a Google Cloud
    # project, enable the Drive API, create an iOS OAuth client, and
    # set the consent screen to External with `drive.file` alone.
    GOOGLE_DRIVE_CLIENT_ID: 658190564191-849rvfnvehedkh4u9mk3n8tsibeq1ers.apps.googleusercontent.com
    # The reversed client id, which is `com.googleusercontent.apps.`
    # plus the id without its `.apps.googleusercontent.com` tail.
    # Info.plist cannot compute it, so it is set beside the id.
    GOOGLE_DRIVE_REDIRECT_SCHEME: com.googleusercontent.apps.658190564191-849rvfnvehedkh4u9mk3n8tsibeq1ers
    CLANG_CXX_LANGUAGE_STANDARD: c++14
    # `YES` / `NO` are Xcode's canonical boolean tokens for build
    # settings. xcodebuild's parser treats them specially. yamllint
    # would prefer lower-case, but lowercasing here risks subtle
    # parser quirks downstream, so disable the rule for these lines.
    CLANG_ENABLE_OBJC_ARC: YES # yamllint disable-line rule:truthy
    CLANG_ENABLE_MODULES: NO # yamllint disable-line rule:truthy
    OTHER_CFLAGS: -fdeclspec
    # Folded scalar (`>-`) collapses newlines into single spaces so
    # the resulting build setting is one whitespace-separated string,
    # matching what xcodebuild expects for `WARNING_CFLAGS`. Listing
    # one flag per line keeps the diff readable when toggling them.
    WARNING_CFLAGS: >-
      -Wno-documentation
      -Wno-shorten-64-to-32
      -Wno-deprecated-declarations
      -Wno-uninitialized
      -Wno-conditional-uninitialized
      -Wno-undefined-var-template
      -Wno-comma
      -Wno-switch
      -Wno-unused-const-variable
      -Wno-deprecated-literal-operator
      -Wno-unused-function
    # Which game cores the app ships. The "Embed the cores" phase reads
    # it, and the Game cores screen lists what it finds in the bundle.
    # Build one core only by passing it on the command line:
    #   xcodebuild ... EMPO_CORES=Psdk30Core
    EMPO_CORES: MkxpCore Psdk25Core Psdk30Core Psdk32Core Psdk33Core MvmzCore
    HEADER_SEARCH_PATHS:
      # GameCore.h, the interface between Empo and every core.
      - $(PROJECT_DIR)/../../cores
      - $(PROJECT_DIR)/shims/libarchive
      # Vendored libmspack (CAB reader for self-extracting .exe game
      # installers). Its sources use angled includes (<mspack.h>).
      - $(PROJECT_DIR)/vendor/libmspack
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES # yamllint disable-line rule:truthy
  configs:
    Debug:
      # Local device installs: use a dev bundle ID a personal team can
      # register. Override in the gitignored Signing.xcconfig if needed.
      PRODUCT_BUNDLE_IDENTIFIER: sh.mateo.empo.dev
      GOOGLE_DRIVE_REDIRECT_SCHEME: com.googleusercontent.apps.658190564191-qhd54l38krfmrhep2jbftfsctqlo77a9
      GOOGLE_DRIVE_CLIENT_ID: 658190564191-qhd54l38krfmrhep2jbftfsctqlo77a9.apps.googleusercontent.com
      ENABLE_TESTABILITY: YES # yamllint disable-line rule:truthy
    Release:
      OTHER_CFLAGS: "-fdeclspec -O3"
      PRODUCT_BUNDLE_IDENTIFIER: sh.mateo.empo
targetTemplates:
  # An extension that the app embeds. Its files are in the folder of
  # its name.
  Extension:
    platform: iOS
    sources:
      - path: ${target_name}
        excludes:
          - Info.plist
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: ${target_name}
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).${target_name}
        # The app's bundle identifier. The game process extension point
        # is <app bundle identifier>.game-process.
        EMPO_HOST_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER:base)
        INFOPLIST_FILE: $(PROJECT_DIR)/${target_name}/Info.plist
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Extension.entitlements
        EMPO_APP_GROUP: group.$(EMPO_HOST_BUNDLE_IDENTIFIER)
        SKIP_INSTALL: YES # yamllint disable-line rule:truthy
targets:
  Empo:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Hydrate ANGLE prebuilt libs
        # ANGLE static libs (~80 MB) are not tracked in git. They live
        # as a release artifact on the empo-deps repo, pinned by version
        # in `ios/Dependencies/ANGLE/.version`. This phase fetches the
        # tarball on first build and skips when a stamp file matches the
        # pinned version. See tools/fetch-angle.sh for details.
        basedOnDependencyAnalysis: false
        script: |
          "${PROJECT_DIR}/../../tools/fetch-angle.sh"

      - name: Wrap the mkxp-z core
        # Fetches the mkxp-z-apple-mobile release that
        # cores/mkxp/.version pins, and links it into
        # MkxpCore.framework. A stamp skips the link when nothing
        # changed. See cores/mkxp/build-framework-ios.sh.
        basedOnDependencyAnalysis: false
        script: |
          "${PROJECT_DIR}/../../cores/mkxp/build-framework-ios.sh" --sdk "${PLATFORM_NAME}"

      - name: Wrap the PSDK cores
        # Fetches the psdk-apple-mobile release that
        # cores/psdk/.version pins, and links each Ruby's
        # library with psdk_app_bridge.cpp into Psdk<NN>Core.framework.
        # A stamp skips the link when nothing
        # changed. See cores/psdk/build-framework-ios.sh.
        basedOnDependencyAnalysis: false
        script: |
          "${PROJECT_DIR}/../../cores/psdk/build-framework-ios.sh" --sdk "${PLATFORM_NAME}"

      - name: Assemble Assets.bundle
        # Force every build. The script copies whatever is in the
        # source directories, so a static outputFiles list would drift
        # and drop a new file without a word.
        #
        # The engine's own assets are not here. Shaders, fonts,
        # gamecontrollerdb.txt, icon.png, the preload and the postload
        # scripts all live in MkxpCore.framework/Assets.bundle, which
        # the engine reads through dladdr on its own image
        # (filesystemImplIOS.mm mkxpOwnBundle). A second copy in the
        # app is dead weight, and nothing in the app reads one.
        basedOnDependencyAnalysis: false
        script: |
          BUNDLE="${PROJECT_DIR}/Assets.bundle"

          # Mozilla CA root bundle. CABundleStore reads this copy from
          # the main bundle and pushes the path into the engine, so
          # the app needs its own.
          mkdir -p "$BUNDLE"
          cp "${PROJECT_DIR}/../Dependencies/mkxp-core/assets/cacert.pem" "$BUNDLE/"

          # Assets that moved into the framework. Drop a stale copy
          # from a tree built before that move.
          rm -rf "$BUNDLE/Shaders" "$BUNDLE/Fonts" "$BUNDLE/Preload" \
            "$BUNDLE/Postload" "$BUNDLE/Patches"
          rm -f "$BUNDLE/gamecontrollerdb.txt" "$BUNDLE/icon.png"

          # Splash background icon pack. Pixelated 16x16 SVGs that
          # the splash's PixelDitherPattern picks N random ones from
          # each launch instead of the historical hand-coded
          # circle/cross/diamond shapes. See `src/Design/SplashIcons.swift`
          # for the loader + parser and RootView.swift for the
          # consumer.
          rm -rf "$BUNDLE/SplashIcons"
          mkdir -p "$BUNDLE/SplashIcons"
          cp "${PROJECT_DIR}/curated-splash-icons/"*.svg "$BUNDLE/SplashIcons/"
      - name: Embed the cores
        # One framework for each core. MkxpCore holds mkxp-z, its
        # three Ruby versions and its SDL. Psdk25Core, Psdk30Core,
        # Psdk32Core and Psdk33Core each wrap the psdk-apple-mobile
        # library of the Ruby of their name. MvmzCore wraps the
        # mvmz-apple-mobile library, which shows RPG Maker MV and MZ
        # games in a web view. The MvmzCore target below builds it with
        # the app. The app links none of them and opens
        # one of them with dlopen when the user picks a game
        # (EngineSessionCoordinator.openCore).
        #
        # A copy phase, not a linked dependency. The app must not bind
        # a single engine name at launch, or a second core could bind
        # to the first core's definitions.
        #
        # EMPO_CORES says which cores to embed, so a release can ship
        # some of them. The app reads the bundle to find out what it got
        # (GameCores.inThisBuild), and refuses a game it cannot run.
        #
        # Force every build: content follows the fetched deps version,
        # not any file Xcode tracks.
        basedOnDependencyAnalysis: false
        script: |
          set -e
          TREE="${PROJECT_DIR}/../Dependencies/build-${PLATFORM_NAME}-arm64"
          DEST="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "$DEST"
          if [ -z "${EMPO_CORES:-}" ]; then
            echo "error: EMPO_CORES is empty - the app would ship no game core" >&2
            exit 1
          fi
          for CORE in ${EMPO_CORES}; do
            case "$CORE" in
              MkxpCore) HOW="cores/mkxp/build-framework-ios.sh --sdk ${PLATFORM_NAME}" ;;
              Psdk25Core|Psdk30Core|Psdk32Core|Psdk33Core) HOW="cores/psdk/build-framework-ios.sh --sdk ${PLATFORM_NAME}" ;;
              MvmzCore) HOW="build the MvmzCore target" ;;
              *)
                echo "error: EMPO_CORES names an unknown core: $CORE" >&2
                exit 1
                ;;
            esac
            CORE_SRC="$TREE/$CORE.framework"
            [ "$CORE" = MvmzCore ] && CORE_SRC="${BUILT_PRODUCTS_DIR}/$CORE.framework"
            if [ ! -d "$CORE_SRC" ]; then
              echo "error: $CORE_SRC missing - run: $HOW" >&2
              exit 1
            fi
            rsync -a --delete "$CORE_SRC" "$DEST/"
            # A nested framework carries its own signature. The app's
            # own signing step does not reach inside it, so sign it
            # here, the way Xcode's Embed Frameworks phase does.
            if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
                --preserve-metadata=identifier,entitlements,flags \
                --timestamp=none "$DEST/$CORE.framework"
            fi
          done
          # An incremental build keeps the framework folder from the last
          # build, so remove a core this build does not ship. PsdkCore is
          # in the list because older builds shipped it.
          for CORE in MkxpCore MvmzCore Psdk25Core Psdk30Core Psdk32Core Psdk33Core PsdkCore; do
            case " ${EMPO_CORES} " in
              *" $CORE "*) continue ;;
            esac
            rm -rf "$DEST/$CORE.framework"
          done
      - name: Generate Git Info
        # Force this script to run every build. Without this, Xcode sees
        # the declared output file already on disk and skips the script,
        # so changing a branch / commit / dirty state wouldn't be
        # reflected in the app until a clean build.
        basedOnDependencyAnalysis: false
        # Register the generated Swift file with the target. It's
        # gitignored so the `src` group scan won't pick it up. Without
        # this + the explicit source entry below, Release builds fail
        # with "Cannot find 'GitInfo' in scope".
        outputFiles:
          - $(PROJECT_DIR)/src/App/GitInfo.generated.swift
        script: |
          REPO="${PROJECT_DIR}/../.."
          COMMIT=$(git -C "$REPO" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          if git -C "$REPO" diff --quiet HEAD 2>/dev/null; then DIRTY="false"; else DIRTY="true"; fi
          BRANCH=$(git -C "$REPO" symbolic-ref --quiet --short HEAD 2>/dev/null || echo "")
          DEFAULT_BRANCH=$(git -C "$REPO" symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||' || echo "main")
          [ -z "$DEFAULT_BRANCH" ] && DEFAULT_BRANCH="main"

          # Normalise the git remote URL into an HTTPS web URL so the
          # app can link into the project (issues page, repo home, etc.)
          # without hardcoding the org/repo. Handles both SSH-style
          # (`git@github.com:org/repo.git`) and HTTPS origins, and
          # strips the `.git` suffix that show up in clones.
          ORIGIN_RAW=$(git -C "$REPO" config --get remote.origin.url 2>/dev/null || echo "")
          case "$ORIGIN_RAW" in
            git@github.com:*) ORIGIN_URL="https://github.com/${ORIGIN_RAW#git@github.com:}" ;;
            ssh://git@github.com/*) ORIGIN_URL="https://github.com/${ORIGIN_RAW#ssh://git@github.com/}" ;;
            *) ORIGIN_URL="$ORIGIN_RAW" ;;
          esac
          ORIGIN_URL="${ORIGIN_URL%.git}"
          # Fall back to the marketing homepage if no origin is set
          # (e.g. a fresh checkout used as a vendored source).
          [ -z "$ORIGIN_URL" ] && ORIGIN_URL="https://github.com/mateo-m/empo-app"
          ISSUES_URL="$ORIGIN_URL/issues"

          OUT="${PROJECT_DIR}/src/App/GitInfo.generated.swift"
          NEW=$(
            echo "// Auto-generated by build script — do not edit"
            echo "enum GitInfo {"
            echo "    static let commit = \"$COMMIT\""
            echo "    static let dirty = $DIRTY"
            echo "    static let branch = \"$BRANCH\""
            echo "    static let defaultBranch = \"$DEFAULT_BRANCH\""
            echo "    static let originURL = \"$ORIGIN_URL\""
            echo "    static let issuesURL = \"$ISSUES_URL\""
            echo "}"
          )
          # Only touch the file when the content changed so
          # downstream Swift compilation isn't invalidated on every
          # build when nothing relevant has shifted.
          if [ ! -f "$OUT" ] || [ "$(cat "$OUT")" != "$NEW" ]; then
            echo "$NEW" > "$OUT"
          fi
    sources:
      # No engine is compiled or linked here. Each one is built into
      # its own framework, which the "Embed the cores" phase copies
      # into the app. MkxpCore holds the mkxp-z core, the three
      # per-Ruby binding objects, every Ruby, SDL and the Ruby stdlib.
      # Psdk25Core, Psdk30Core, Psdk32Core and Psdk33Core each hold
      # LiteRGSS2, LiteCGSS, SFML and the Ruby of their name.
      #
      # cores/mkxp/build-framework-ios.sh links MkxpCore from the
      # mkxp-z-apple-mobile release, and cores/mkxp/check-framework.sh
      # proves it exports nothing but mkxp_*.
      # Vendored libmspack CAB reader (see vendor/libmspack/README.md).
      - path: vendor/libmspack
        type: group
      - path: src
        type: group
      # The messages between the app and its game process.
      - path: GameProcess/EmpoGameProcessProtocol.m
      # A game that runs in the app plays its sound through the app.
      - path: GameProcess/AudioSession.m
      # Gitignored generated file. Listed explicitly so xcodegen keeps
      # it in Compile Sources after `src` group scans skip ignored paths.
      - path: src/App/GitInfo.generated.swift
        optional: true
      - path: PrivacyInfo.xcprivacy
      - path: Assets.xcassets
      - path: Assets.bundle
        type: folder
        buildPhase: resources
    # Code signing is configured via a local, untracked xcconfig
    # (Signing.xcconfig in this directory) so each machine can set
    # DEVELOPMENT_TEAM and optionally override PRODUCT_BUNDLE_IDENTIFIER
    # without touching the project file. See Signing.xcconfig.example.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        INFOPLIST_FILE: $(PROJECT_DIR)/Info.plist
        PRODUCT_NAME: Empo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # The file carries the iCloud keys of SPEC 9.1, and it must
        # never go missing. A build with SOME .entitlements file
        # always signs with an entitlements blob. Naive resigners
        # (notably ESign) read that blob as their template. Without
        # it they synthesize an incomplete one that breaks document
        # picker's sandbox-extension grants on the picked URL (Open
        # does nothing for files, spinner-forever for folders).
        # Sideloadly + AltStore synthesize correctly so they work
        # regardless, but shipping an explicit file unblocks ESign
        # too.
        # A team that cannot register the iCloud container points
        # EMPO_ENTITLEMENTS at Empo-NoICloud.entitlements in its own
        # Signing.xcconfig. CI leaves that file empty, so the default
        # applies and the unsigned build carries the iCloud keys.
        CODE_SIGN_ENTITLEMENTS: $(EMPO_ENTITLEMENTS:default=Empo.entitlements)
        # The folder that the app shares with the game process.
        EMPO_APP_GROUP: group.$(PRODUCT_BUNDLE_IDENTIFIER)
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/src/Empo-Bridging-Header.h
        # Writes the game-process extension point that
        # GameProcessHost.swift declares into the app.
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES # yamllint disable-line rule:truthy
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/GameProcess
        OTHER_LDFLAGS:
          # The engine is not here. It lives in MkxpCore.framework or a
          # core framework, which the "Embed the cores" phase copies
          # into the app. Every gamecore_* name the app calls resolves
          # through AppCoreForwarders.c, which sends the call to the
          # GameProcess extension or to the core the app opened with
          # dlopen, so the linker sees none of them.
          #
          # What stays is what Empo itself uses: libarchive and its
          # compressors for the importer, and the frameworks its own
          # UI, audio session and controller code need.
          - -larchive
          - -lz
          - -lbz2
          - -liconv
          - -framework Foundation
          - -framework UIKit
          - -framework CoreFoundation
          - -framework CoreGraphics
          - -framework QuartzCore
          - -framework AVFoundation
          - -framework GameController
          - -weak_framework CoreHaptics
    dependencies:
      - package: GameProbe
      - package: AppAuth
        product: AppAuth
      - package: Automerge
        product: Automerge
      - target: GameProcess
      - target: FilesProvider
      # Built first, then copied by "Embed the cores".
      - target: MvmzCore
        link: false
        embed: false
  EmpoChecks:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: checks
    dependencies:
      - target: Empo
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.mateo.empo.dev2.checks
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ""
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  GameProcess:
    # One process for each game. The app starts it with ExtensionKit,
    # and it opens the core of the game from the app's Frameworks.
    type: extensionkit-extension
    templates:
      - Extension
    sources:
      # The memory of the game goes in a block that the app lends it
      # (GameProcess/AppMemory.m). See vendor/mimalloc/README.md and
      # vendor/fishhook/README.md.
      # Each free() of the game goes through it. At -O0, a Ruby 1.8
      # garbage collection took more than twice as long.
      - path: vendor/mimalloc/src/static.c
        compilerFlags: -O3 -DMI_DEBUG=0 -DMI_FREE_USE_PAGEMAP=1 -w
      - path: vendor/fishhook/fishhook.c
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/vendor/mimalloc/include
          - $(PROJECT_DIR)/vendor/fishhook
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/GameProcess/GameProcess-Bridging-Header.h
        OTHER_LDFLAGS:
          - -framework Foundation
          - -framework UIKit
          - -framework AVFoundation
          - -framework Metal
  FilesProvider:
    # Shows the games and saves, which live in the app group, in the
    # Files app.
    type: app-extension
    templates:
      - Extension
  MvmzCore:
    type: framework
    platform: iOS
    sources:
      - path: ../../cores/mvmz
        excludes:
          - Info.plist
          - fetch.sh
          - .version
    preBuildScripts:
      - name: Fetch the MV/MZ core
        # The mvmz-apple-mobile release that cores/mvmz/.version
        # pins. See cores/mvmz/fetch.sh.
        basedOnDependencyAnalysis: false
        script: |
          "${PROJECT_DIR}/../../cores/mvmz/fetch.sh"
      - name: Write the core export list
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_TEMP_DIR)/gamecore.exports
        script: |
          mkdir -p "${TARGET_TEMP_DIR}"
          "${PROJECT_DIR}/../../cores/gamecore-exports.sh" "${TARGET_TEMP_DIR}/gamecore.exports"
    postBuildScripts:
      - name: Name the MV/MZ core release
        # The Game cores screen shows EmpoCoreVersion, the release tag
        # that cores/mvmz/.version pins. The input orders it after Xcode
        # writes the Info.plist. Without one, the two can run in either
        # order.
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -e
          VERSION="$(cut -d" " -f1 "${PROJECT_DIR}/../Dependencies/mvmz-core/.fetched-pin")"
          /usr/libexec/PlistBuddy -c "Set :EmpoCoreVersion $VERSION" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
    settings:
      base:
        PRODUCT_NAME: MvmzCore
        PRODUCT_BUNDLE_IDENTIFIER: sh.mateo.empo.mvmzcore
        INFOPLIST_FILE: $(PROJECT_DIR)/../../cores/mvmz/Info.plist
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/../../cores
          - $(PROJECT_DIR)/../Dependencies/mvmz-core/include
        OTHER_LDFLAGS:
          - -Wl,-exported_symbols_list,$(TARGET_TEMP_DIR)/gamecore.exports
          - $(PROJECT_DIR)/../Dependencies/mvmz-core/$(PLATFORM_NAME)/libmvmz.a
          - -framework WebKit
          - -framework UIKit
          - -framework Metal
          - -framework UniformTypeIdentifiers
        CLANG_ENABLE_MODULES: YES # yamllint disable-line rule:truthy
        SKIP_INSTALL: YES # yamllint disable-line rule:truthy
        DEFINES_MODULE: NO # yamllint disable-line rule:truthy
        VERSIONING_SYSTEM: ""
        # "Embed the cores" signs the copy inside the app.
        CODE_SIGNING_ALLOWED: NO
  EmpoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Empo
    settings:
      base:
        TEST_TARGET_NAME: Empo
        PRODUCT_BUNDLE_IDENTIFIER: sh.mateo.empo.tests
        CODE_SIGNING_ALLOWED: NO
schemes:
  EmpoChecks:
    build:
      targets:
        Empo: all
        EmpoChecks: test
    test:
      config: Debug
      targets:
        - EmpoChecks
  Empo:
    build:
      targets:
        Empo: all
        EmpoTests: [test]
    test:
      config: Debug
      targets:
        - EmpoTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
