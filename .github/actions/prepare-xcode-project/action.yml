---
name: Prepare the Xcode project
description: Select the newest Xcode, fetch ANGLE and generate Empo.xcodeproj.

inputs:
  build-data:
    description: >-
      A folder name in the runner's tool cache. With it, DERIVED_DATA
      points to a folder that the next run of the job uses again.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Select newest Xcode
      # DEVELOPER_DIR instead of xcode-select: no sudo, so the same
      # step works on hosted runners and a self-hosted Mac.
      shell: bash
      run: |
        XCODE="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n 1)"
        echo "Using $XCODE"
        echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

    - name: Choose the build data folder
      if: inputs.build-data != ''
      shell: bash
      env:
        ROOT: ${{ runner.tool_cache }}/empo-ci
        NAME: ${{ inputs.build-data }}
      run: |
        XCODE_BUILD="$(xcodebuild -version | awk '/^Build version/ {print $3}')"
        DIR="$ROOT/$XCODE_BUILD/$NAME"
        mkdir -p "$ROOT"
        # Build data of another Xcode is of no use to this one.
        find "$ROOT" -mindepth 1 -maxdepth 1 ! -name "$XCODE_BUILD" -exec rm -rf {} +
        # A re-run starts from an empty folder, so a damaged folder
        # cannot block CI.
        if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
          rm -rf "$DIR"
        fi
        echo "DERIVED_DATA=$DIR" >> "$GITHUB_ENV"
        echo "XCODE_BUILD=$XCODE_BUILD" >> "$GITHUB_ENV"
        echo "Build data in $DIR"

    # Xcode and SwiftPM compare the date of each source file with the
    # date in their build records, and a checkout gives every file the
    # time of the checkout. The commit dates give each unchanged file the
    # same date as in the cached run.
    - name: Give each file the date of its last commit
      if: inputs.build-data != '' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        git fetch --quiet --unshallow --filter=blob:none origin
        HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet git-tools
        # With rename detection, git downloads the old file of each
        # rename one at a time, and the step takes minutes, not seconds.
        # With --merge, a file that only the merge of a pull request into
        # main changes gets the time of that merge, so it builds again.
        git -c diff.renames=false restore-mtime --commit-time --merge --quiet

    - name: Restore the build data from the GitHub cache
      if: >-
        inputs.build-data != '' && runner.environment == 'github-hosted' &&
        github.run_attempt == '1'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.DERIVED_DATA }}
          ios/Dependencies
          ios/GameProbe/.build
          ios/Json5/.build
        key: build-${{ inputs.build-data }}-${{ env.XCODE_BUILD }}-${{ github.run_id }}
        restore-keys: build-${{ inputs.build-data }}-${{ env.XCODE_BUILD }}-

    # The cache saves each folder whole, so a "!" path inside one of them
    # does not keep it out.
    - name: Remove what the build must not take from earlier runs
      if: inputs.build-data != ''
      shell: bash
      run: |
        # The objects stay. The app is put together again, so a file or
        # core that a change removes cannot stay in it.
        rm -rf "$DERIVED_DATA/Build/Products"
        # The cache also holds the tracked version files of an older
        # commit.
        git checkout -- ios/Dependencies

    - name: Install xcodegen
      # Two runners on one Mac run this at the same time, and a second
      # brew install fails on the lock of the first one.
      shell: bash
      run: |
        command -v xcodegen >/dev/null ||
          HOMEBREW_NO_AUTO_UPDATE=1 lockf -k /tmp/empo-ci-brew.lock \
            sh -c 'command -v xcodegen >/dev/null || brew install xcodegen'

    - name: Fetch ANGLE
      shell: bash
      run: tools/fetch-angle.sh

    - name: Create empty signing overrides
      # Signing.xcconfig is a gitignored per-machine file (see
      # Signing.xcconfig.example). CI builds unsigned, so empty works.
      shell: bash
      run: touch ios/Empo/Signing.xcconfig

    - name: Generate Xcode project
      shell: bash
      working-directory: ios/Empo
      run: xcodegen generate --spec project.yml --project . --quiet
