---
name: Prepare the Xcode project
description: Select the newest Xcode, fetch ANGLE and generate Empo.xcodeproj.

runs:
  using: composite
  steps:
    # The checkout runs with `clean: false`, because its clean also
    # deletes ios/Dependencies and the Swift package builds. The fetch
    # scripts compare a stamp in ios/Dependencies with the pins, so a
    # kept folder skips the downloads.
    - name: Remove untracked files, but keep the downloaded cores and package builds
      shell: bash
      run: git clean -ffdx -e /ios/Dependencies/ -e .build/

    - name: Select newest Xcode
      # DEVELOPER_DIR instead of xcode-select: no sudo, so the same
      # step works on hosted runners and a self-hosted Mac.
      shell: bash
      run: |
        XCODE="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n 1)"
        echo "Using $XCODE"
        echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

    - name: Install xcodegen
      shell: bash
      run: brew install xcodegen

    - name: Fetch ANGLE
      shell: bash
      run: tools/fetch-angle.sh

    - name: Create empty signing overrides
      # Signing.xcconfig is a gitignored per-machine file (see
      # Signing.xcconfig.example). CI builds unsigned, so empty works.
      shell: bash
      run: touch ios/Empo/Signing.xcconfig

    - name: Generate Xcode project
      shell: bash
      working-directory: ios/Empo
      run: xcodegen generate --spec project.yml --project . --quiet
