name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "PRIVACY.md"
      - "TERMS.md"
      - "SUPPORT.md"
      - "tools/**"
      - "landing/**"
      - "pages/**"
      - "public/**"
      - "theme.css"
      - "blume.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    # A release tag rebuilds the What's new page with the new release. Path
    # filters do not apply to tag pushes, so every tag builds the whole site.
    tags: ["v*.*.*"]
    paths:
      - "CHANGELOG.md"
      - "docs/**"
      - "PRIVACY.md"
      - "TERMS.md"
      - "SUPPORT.md"
      - "tools/**"
      - "landing/**"
      - "pages/**"
      - "public/**"
      - "theme.css"
      - "blume.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older build. Deploys share
# one group with no cancel, so a deploy never stops halfway.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # The changelog page reads the engine commits between the engine
      # pins of two release tags, so it needs the tags and the engine history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the engine history
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/mateo-m/mkxp-z-apple-mobile.git .engine-history

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the site
        run: bun run docs:build

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
