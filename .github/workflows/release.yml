---
# Releases Empo. scripts/release.sh has each step, and this workflow runs
# the same steps:
#
#   * scripts/release.sh cut <bump> on a computer pushes a v*.*.* tag,
#     and the tag push starts this workflow.
#   * mode=cut commits the bump to main through the API, builds that
#     commit, and makes the tag only when the build passes.
#   * mode=dry-run builds and audits a ref, and publishes nothing.
#   * mode=announce posts a published release to Discord again.
#
# Secrets:
#   EMPO_RELEASE_TOKEN           A fine-grained token, Contents: read and
#                                write on this repo. GitHub signs the
#                                commits it makes, and the role of its
#                                owner lets them go to main.
#   DISCORD_RELEASE_WEBHOOK_URL  The channel for release posts.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      mode:
        description: "cut = bump + tag + full release; dry-run = build + audit only; announce = re-post an existing release to Discord"
        type: choice
        options: [cut, dry-run, announce]
        default: cut
      bump:
        description: "cut only: major | minor | patch, or an explicit semver"
        required: false
        default: "patch"
      version:
        description: "announce only: released version to post (e.g. 0.4.0)"
        required: false
        default: ""
      ref:
        description: "dry-run only: ref to build (tag, branch, or sha). It must have the build command of scripts/release.sh"
        required: false
        default: "main"

permissions:
  contents: read

# The Discord action still runs on Node.js 16, which GitHub no longer
# ships. Drop this when it moves to Node.js 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release

jobs:
  cut:
    name: Cut release
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cut'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Require EMPO_RELEASE_TOKEN
        env:
          GH_TOKEN: ${{ secrets.EMPO_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::EMPO_RELEASE_TOKEN is not set. Create a fine-grained PAT (Contents: Read+Write on this repo) and add it as a repo secret."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Install git-cliff
        env:
          GIT_CLIFF_SHA256: 9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546
        run: |
          set -e
          curl -fsSL -o /tmp/git-cliff.tar.gz \
            https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz
          echo "$GIT_CLIFF_SHA256  /tmp/git-cliff.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          BIN="$(find /tmp -type f -name git-cliff -perm -u+x | head -n 1)"
          sudo mv "$BIN" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Bump the version and write the changelog
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: scripts/release.sh prepare "$INPUT_BUMP" >> "$GITHUB_OUTPUT"

      - name: Commit to main
        id: commit
        env:
          GH_TOKEN: ${{ secrets.EMPO_RELEASE_TOKEN }}
          MESSAGE: ${{ steps.prepare.outputs.message }}
        run: |
          set -e
          HEAD="$(git rev-parse HEAD)"
          base64 < ios/Empo/project.yml | tr -d '\n' > /tmp/project.b64
          base64 < CHANGELOG.md | tr -d '\n' > /tmp/changelog.b64
          # shellcheck disable=SC2016 # the GraphQL query names its own $variables
          OID=$(gh api graphql \
            -F repo="$GITHUB_REPOSITORY" -F head="$HEAD" \
            -F message="$MESSAGE" \
            -F path1="ios/Empo/project.yml" -F contents1=@/tmp/project.b64 \
            -F path2="CHANGELOG.md" -F contents2=@/tmp/changelog.b64 \
            -f query='mutation($repo: String!, $head: GitObjectID!, $message: String!, $path1: String!, $contents1: Base64String!, $path2: String!, $contents2: Base64String!) {
              createCommitOnBranch(input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                expectedHeadOid: $head,
                message: {headline: $message},
                fileChanges: {additions: [{path: $path1, contents: $contents1}, {path: $path2, contents: $contents2}]}
              }) { commit { oid } }
            }' --jq '.data.createCommitOnBranch.commit.oid')
          echo "bump commit: $OID"
          echo "sha=$OID" >> "$GITHUB_OUTPUT"

  build:
    name: Build + audit .ipa
    needs: cut
    # A tag push and a dry run skip `cut`, so the job states its own
    # condition instead of the default `success()`.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') ||
       needs.cut.result == 'success')
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER) }}
    timeout-minutes: 90
    outputs:
      version: ${{ steps.build.outputs.version }}
      ipa_size: ${{ steps.build.outputs.ipa_size }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cut.outputs.sha || (github.event_name == 'workflow_dispatch' && inputs.ref) || github.ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      # The cut job checks the pins before it commits. A tag can come
      # from a computer, so check them again here.
      - name: Verify empo-deps pins
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_PUBLISHED: "1"
        run: scripts/verify-empo-deps-pins.sh

      - uses: ./.github/actions/prepare-xcode-project

      # The audit fails when the app version is not this version. A dry
      # run builds whatever version its ref has.
      - name: Build, sign, audit, and package
        id: build
        env:
          VERSION: ${{ needs.cut.outputs.version || (github.event_name == 'push' && github.ref_name) || '' }}
        run: scripts/release.sh build ${VERSION:+"${VERSION#v}"} >> "$GITHUB_OUTPUT"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Empo-ios
          path: ${{ steps.build.outputs.ipa_path }}

      - name: Upload Mac disk image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Empo-mac
          path: ${{ steps.build.outputs.dmg_path }}

  tag:
    name: Create the tag
    needs: [cut, build]
    if: >-
      !cancelled() && needs.cut.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the built commit
        # A tag pushed with GITHUB_TOKEN starts no workflow run, so
        # this run is the only one that publishes the release.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.cut.outputs.version }}
          SHA: ${{ needs.cut.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" -f sha="$SHA" >/dev/null
          echo "tagged v$VERSION at $SHA"

  publish:
    name: Publish the GitHub release
    needs: [cut, build, tag]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (github.event_name == 'push' || needs.tag.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cut.outputs.sha || github.ref }}
          submodules: false
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -e
          scripts/release.sh notes "$VERSION" > release-notes.md
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            dist/*

  post-release:
    name: Sync AltStore manifest
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The AltStore entry reads the build number from the tag.
          fetch-depth: 0
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Update AltStore source
        id: altstore
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IPA_SIZE: ${{ needs.build.outputs.ipa_size }}
        run: |
          set -e
          bun install --frozen-lockfile
          scripts/release.sh altstore "$VERSION" "$IPA_SIZE" >> "$GITHUB_OUTPUT"

      - name: Push sync commit to main
        # The job reads the head of main just before the commit. When
        # main moves in between, the commit fails and changes nothing.
        env:
          GH_TOKEN: ${{ secrets.EMPO_RELEASE_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          MESSAGE: ${{ steps.altstore.outputs.message }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::EMPO_RELEASE_TOKEN is not set; finish manually with: scripts/release.sh sync $VERSION"
            exit 1
          fi
          HEAD="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          base64 < altstore-source.json | tr -d '\n' > /tmp/altstore.b64
          # shellcheck disable=SC2016 # the GraphQL query names its own $variables
          gh api graphql \
            -F repo="$GITHUB_REPOSITORY" -F head="$HEAD" \
            -F message="$MESSAGE" \
            -F path1="altstore-source.json" -F contents1=@/tmp/altstore.b64 \
            -f query='mutation($repo: String!, $head: GitObjectID!, $message: String!, $path1: String!, $contents1: Base64String!) {
              createCommitOnBranch(input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                expectedHeadOid: $head,
                message: {headline: $message},
                fileChanges: {additions: [{path: $path1, contents: $contents1}]}
              }) { commit { oid } }
            }' --jq '.data.createCommitOnBranch.commit.oid'
          echo "v$VERSION fully released"

  # A release that GITHUB_TOKEN makes starts no workflow, so an
  # `on: release` workflow never runs. This job posts the release.
  notify:
    name: Post release changelog to Discord
    needs: [cut, build, publish]
    if: >-
      !cancelled() &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'announce'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
        run: |
          set -e
          if [ "$MODE" = "announce" ]; then
            VERSION="$INPUT_VERSION"
            if [ -z "$VERSION" ]; then
              echo "::error::announce mode needs the version input (e.g. 0.4.0)"
              exit 1
            fi
          else
            VERSION="${{ needs.build.outputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A tag push checks out the tag, and a cut checks out the commit
      # it tagged. Announce mode checks out the branch it runs on, so it
      # posts notes that were fixed after the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cut.outputs.sha }}
          submodules: false

      - name: Extract release notes
        id: notes
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          # Command substitution strips trailing newlines. Printf puts
          # exactly one back so the heredoc delimiter sits on its own
          # line (extract-changelog.sh output has no trailing newline).
          BODY="$(scripts/extract-changelog.sh "$VERSION")"
          {
            echo "body<<EMPO_NOTES_EOF"
            printf '%s\n' "$BODY"
            echo "EMPO_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send release to Discord
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          username: Empo Releases
          footer_title: Empo Release Notes
          reduce_headings: true
          release_name: v${{ steps.version.outputs.version }}
          release_body: ${{ steps.notes.outputs.body }}
          release_html_url: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}
