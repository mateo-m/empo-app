---
# The consolidated PR/main gate: every job that used to live in
# lint.yml, format.yml, test.yml, deps-pins.yml and build.yml, in one
# workflow with one trigger block.
#
# The ruleset's required context is a check-run name, which comes from
# a JOB name, so the "CI" summary job at the bottom must keep that
# exact name. It is the only context a merge waits on, and it needs
# every other job in this file.
#
# Requires secret EMPO_DEPS_READ_TOKEN (read access to empo-deps) for
# the ANGLE tarball. The core releases are public.
#
# The repository variables LINUX_RUNNER and MACOS_RUNNER choose the
# machines. The value is JSON: a label list such as
# ["self-hosted","linux","md"], or one quoted label such as
# "ubuntu-latest". A bare ubuntu-latest fails. With no variable, a
# job runs on a GitHub-hosted machine. A pull request from a fork
# does too. A fork can edit this file, so only the repository's
# approval rule for fork runs keeps fork code off a self-hosted machine.
# docs.yml and pr-title.yml read LINUX_RUNNER too.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Several pinned actions (actions/cache, cirruslabs/swiftlint-action,
# awalsh128/cache-apt-pkgs-action) still run on Node.js 20. GitHub is
# forcing all JS actions to Node.js 24. Opt in so the deprecation
# banner is silenced. Drop once every pinned action ships Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A docs-only pull request cannot break the GameProbe tests or a
  # Simulator build, so those two jobs skip.
  #
  # The skip MUST be a job-level `if:`, never a workflow-level
  # `paths-ignore`. The ruleset requires the "CI" context. A workflow
  # that path-filters itself away never reports it, and the PR waits
  # forever for a status that cannot arrive. A job skipped by `if:`
  # still reports, and GitHub counts a skipped job as a success. The
  # summary job runs with `if: always()` and fails only on `failure` or
  # `cancelled`, so a skipped `test` job leaves it green with no edit.
  #
  # The classifier is conservative on purpose. A path that is not
  # documentation counts as code, and any failure to read the file
  # list runs the full gate. `docs/schemas/` and `docs/examples/` are
  # code here: ControlsSchemaTests reads both from the repository
  # root, so a change to either must still run the tests.
  changes:
    name: Detect docs-only changes
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Classify the changed paths
        id: classify
        # gh ships preinstalled on GitHub-hosted ubuntu runners. The
        # API gives the file list without cloning the repository.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          full_gate() {
            printf '%s\n' "$1"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "$PR_NUMBER" ] || full_gate "not a pull request: running every job"
          FILES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename') ||
            full_gate "::warning::could not read the changed files: running every job"
          [ -n "$FILES" ] || full_gate "::warning::the changed file list is empty: running every job"
          printf 'changed files:\n%s\n' "$FILES"
          CODE=$(printf '%s\n' "$FILES" |
            grep -Ev '^(docs/|public/)|^blume\.config\.ts$|\.md$') || CODE_STATUS=$?
          FIXTURES=$(printf '%s\n' "$FILES" |
            grep -E '^docs/(schemas|examples)/') || FIXTURE_STATUS=$?
          # grep exits 1 when nothing matches, which is an answer here,
          # not a failure. A status above 1 IS a failure, and its empty
          # output would otherwise read as "no code touched".
          if [ "${CODE_STATUS:-0}" -gt 1 ] || [ "${FIXTURE_STATUS:-0}" -gt 1 ]; then
            full_gate "::warning::could not classify the changed paths: running every job"
          fi
          if [ -n "$CODE$FIXTURES" ]; then
            echo "the diff touches code: running every job"
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "the diff is documentation only: skipping the test and Simulator jobs"
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  # One job for every lint check, so a run starts one runner for them,
  # not six. Each check step runs when an earlier one failed, so one
  # run reports every failure.
  lint:
    name: Lint
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Find preinstalled tools
        # The self-hosted runners cannot use sudo, so apt and
        # swiftly-action cannot run there. Their image ships these
        # tools.
        id: preinstalled
        run: |
          if swift --version 2>/dev/null | grep -q 'Swift version 6\.4'; then
            echo "swift=true" >>"$GITHUB_OUTPUT"
          fi
          command -v shellcheck >/dev/null && command -v yamllint >/dev/null &&
            echo "apt=true" >>"$GITHUB_OUTPUT" || true

      - name: Cache Swift toolchain
        if: steps.preinstalled.outputs.swift != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-6.4

      - name: Install Swift toolchain
        if: steps.preinstalled.outputs.swift != 'true'
        # Swiftly is Apple's official toolchain manager. Gives us
        # swift-format on ubuntu-latest without a custom container.
        # On cache hit the action detects the existing toolchain and
        # short-circuits the slow download.
        uses: vapor/swiftly-action@v0.2
        with:
          toolchain: "6.4"

      - name: "Cache apt: shellcheck, yamllint"
        if: steps.preinstalled.outputs.apt != 'true'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: shellcheck yamllint
          version: "1.0"

      - name: Install shfmt
        run: |
          command -v shfmt >/dev/null && exit 0
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  $HOME/.local/bin/shfmt" |
            sha256sum --check --strict
          chmod +x "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2
        # Bun's CLI replaces Node + npm. Built-in install cache
        # keyed off bun.lock. Faster install than npm ci.

      - name: Install JS tools
        run: bun install --frozen-lockfile

      - name: Locate sourcekitd for SwiftLint
        # SwiftLint on Linux loads `libsourcekitdInProc.so` from
        # `LINUX_SOURCEKIT_LIB_PATH`. The `swift` binary on PATH is
        # actually swiftly's manager, not the toolchain's swift, so
        # `which swift` doesn't help. Locate the lib directly under
        # `$SWIFTLY_HOME_DIR/toolchains/<version>/usr/lib/`. A
        # preinstalled toolchain has it next to its own `swift`.
        run: |
          if [ -n "${SWIFTLY_HOME_DIR:-}" ]; then
            SK_ROOT="$SWIFTLY_HOME_DIR/toolchains"
          else
            SK_ROOT=$(dirname "$(dirname "$(readlink -f "$(command -v swift)")")")
          fi
          SK_LIB_FILE=$(find "$SK_ROOT" -name 'libsourcekitdInProc.so' 2>/dev/null | head -1)
          if [ -z "$SK_LIB_FILE" ]; then
            echo "::error::libsourcekitdInProc.so not found under $SK_ROOT"
            exit 1
          fi
          SK_LIB=$(dirname "$SK_LIB_FILE")
          echo "Found sourcekitd at $SK_LIB_FILE"
          echo "LINUX_SOURCEKIT_LIB_PATH=$SK_LIB" >> "$GITHUB_ENV"

      - name: swift-format lint
        if: ${{ !cancelled() }}
        # swift-format's lint mode reports the same rule set the
        # formatter would apply, so a clean lint doubles as the
        # format check.
        run: swift-format lint --strict --recursive ios/Empo/src

      - name: SwiftLint
        if: ${{ !cancelled() }}
        # cirruslabs action lets us pin the SwiftLint version so it
        # matches what's been validated locally + in `.swiftlint.yml`.
        uses: cirruslabs/swiftlint-action@v1
        with:
          version: 0.63.2
          args: --strict

      - name: clang-format check
        if: ${{ !cancelled() }}
        # clang-format 18 matches local (Apple clang-format 21 is also
        # fine, the shipped .clang-format is style-stable).
        run: |
          command -v clang-format-18 >/dev/null ||
            { sudo apt-get update && sudo apt-get install -y clang-format-18; }
          set -o pipefail
          git ls-files -z 'ios/Empo/src/*.'{h,m,mm,c,cpp} 'ios/Empo/shims/*.'{h,m,mm,c,cpp} |
            xargs -0 -r clang-format-18 --dry-run --Werror

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: |
          FILES=$(git ls-files 'setup.sh' 'tools/*.sh' 'scripts/*.sh' 'scripts/hooks/*.sh')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs shellcheck
          fi

      - name: shfmt check
        if: ${{ !cancelled() }}
        run: |
          FILES=$(git ls-files 'setup.sh' 'tools/*.sh' 'scripts/*.sh' 'scripts/hooks/*.sh')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs shfmt -d -i 4 -ci
          fi

      - name: oxfmt check (YAML + JSON)
        if: ${{ !cancelled() }}
        run: bun run fmt:check

      - name: yamllint
        if: ${{ !cancelled() }}
        run: |
          # yamllint warnings shouldn't fail CI. Only structural
          # errors should. --strict promotes warnings to failures,
          # so we run twice: first to surface the issues, then
          # `|| true` to keep the soft-warn behaviour.
          yamllint -c .yamllint.yml ios/Empo/project.yml || true
          yamllint --strict -c .yamllint.yml ios/Empo/project.yml \
            || echo "yamllint reported issues (warnings tolerated; failing only on errors)"

      - name: markdownlint
        if: ${{ !cancelled() }}
        run: |
          # Drive markdownlint from git ls-files so we only scan
          # tracked files. Vendored upstream READMEs and build outputs
          # are skipped because they're already gitignored.
          FILES=$(git ls-files '*.md')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs bun x markdownlint -c .markdownlint.json
          fi

      - name: Verify pins against empo-deps
        if: ${{ !cancelled() }}
        # Tag-time verification (REQUIRE_PUBLISHED=1) happens in the
        # Release workflow. Here unpublished pins only warn.
        env:
          GH_TOKEN: ${{ secrets.EMPO_DEPS_READ_TOKEN || github.token }}
          REQUIRE_PUBLISHED: "0"
        run: scripts/verify-empo-deps-pins.sh

  test:
    name: GameProbe (swift test, Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: ios/GameProbe
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Find a preinstalled Swift 6.4
        # The self-hosted runners cannot use sudo, and swiftly-action
        # always runs apt-get with sudo. Their image ships Swift 6.4.
        id: preinstalled
        run: |
          if swift --version 2>/dev/null | grep -q 'Swift version 6\.4'; then
            echo "swift=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Cache Swift toolchain
        if: steps.preinstalled.outputs.swift != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-6.4

      - name: Install Swift toolchain
        if: steps.preinstalled.outputs.swift != 'true'
        uses: vapor/swiftly-action@v0.2
        with:
          toolchain: "6.4"

      # Json5 is not in this list. The package ships to iOS, and the
      # macOS Simulator build job runs it.
      - name: swift test
        working-directory: ${{ github.workspace }}
        run: scripts/run-swift-tests.sh ios/GameProbe

  simulator:
    name: Simulator build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.MACOS_RUNNER || '"macos-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Select newest Xcode
        # DEVELOPER_DIR instead of xcode-select: no sudo, so the same
        # step works on hosted runners and a self-hosted Mac.
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      # macOS is the only runner that can run every check: Linux
      # Foundation has no legacy text encodings. EMPO_TESTS_NO_SKIP=1 turns a skip
      # here into a failure, so a check cannot go missing on both
      # runners at once.
      - name: Swift package tests, with no skips allowed
        env:
          EMPO_TESTS_NO_SKIP: "1"
        run: scripts/run-swift-tests.sh

      - name: Install xcodegen
        run: brew install xcodegen

      # The Xcode build phases fetch ANGLE and the cores, and skip a
      # fetch when the stamp in the folder matches the pin. A cache hit
      # skips the downloads.
      - name: Cache the cores
        uses: actions/cache@v4
        with:
          path: |
            ios/Dependencies/ANGLE/iphoneos
            ios/Dependencies/ANGLE/iphonesimulator
            ios/Dependencies/ANGLE/.fetched-version
            ios/Dependencies/mkxp-core
            ios/Dependencies/psdk-core
            ios/Dependencies/mvmz-core
          key: cores-${{ runner.os }}-${{ hashFiles('ios/Dependencies/ANGLE/.version', 'cores/mkxp/.version', 'cores/psdk/.version', 'cores/mvmz/.version') }}

      - name: Fetch ANGLE
        env:
          GH_TOKEN: ${{ secrets.EMPO_DEPS_READ_TOKEN }}
        run: tools/fetch-angle.sh

      - name: Create empty signing overrides
        # Signing.xcconfig is a gitignored per-machine file (see
        # Signing.xcconfig.example). CI builds unsigned, so empty works.
        run: touch ios/Empo/Signing.xcconfig

      - name: Generate Xcode project
        working-directory: ios/Empo
        run: xcodegen generate --spec project.yml --project . --quiet

      - name: Build (iOS Simulator)
        working-directory: ios/Empo
        run: |
          set -o pipefail
          xcodebuild \
            -project Empo.xcodeproj \
            -scheme Empo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            build 2>&1 | tail -n 60

      # Best-effort boot smoke: install the built app on a simulator
      # and confirm the process survives its first seconds. Depends on
      # the runner image shipping a matching iOS runtime, so failures
      # here don't fail the gate (flip continue-on-error off once this
      # proves stable on the current image).
      - name: Boot smoke test
        continue-on-error: true
        run: |
          set -e
          APP="$(find ios/Empo/DerivedData/Build/Products -name 'Empo.app' -maxdepth 3 | head -n 1)"
          [ -n "$APP" ] || { echo "no Empo.app found"; exit 1; }
          UDID="$(xcrun simctl list devices available --json |
            /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(dev["udid"] for devs in d.values() for dev in devs if dev["isAvailable"]))')"
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" "$APP"
          BUNDLE_ID="$(defaults read "$PWD/$APP/Info" CFBundleIdentifier)"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 10
          xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE_ID" ||
            { echo "app process exited within 10s"; exit 1; }
          echo "boot smoke OK"

  # The aggregate gate. Its check-run name matches the ruleset's one
  # required context, "CI", exactly. The jobs above have descriptive
  # names the ruleset does not track one by one, so this job is what a
  # merge waits on - and it needs EVERY one of them. Add a job above,
  # add it here too, or a merge stops waiting for it.
  #
  # It carried the name "Lint" while it aggregated the lint jobs alone.
  # A red Simulator build could then land on main and surface at the
  # release cut instead. A "Format" twin also sat beside it, needing a
  # subset of the same jobs: a subset cannot fail while the superset
  # passes, so it gated nothing and cost a second required context.
  #
  # The required contexts live in the repository ruleset, not in this
  # file, so the rename and the removal took a settings change as well.
  # Keep the two in step: rename this job and the ruleset stops seeing
  # the context it waits for.
  #
  # The gate also needs `changes`. A failed classifier skips the jobs
  # that depend on it, and a skipped job passes - so without this edge,
  # a broken classifier would wave code through on a green gate.
  ci-summary:
    name: CI
    needs:
      - changes
      - lint
      - test
      - simulator
    if: always()
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Verify every job passed
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
