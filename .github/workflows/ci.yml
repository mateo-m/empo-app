---
# The ruleset's required context is a check-run name, which comes from
# a JOB name, so the "CI" summary job at the bottom must keep that
# exact name. It is the only context a merge waits on, and it needs
# every other job in this file.
#
# The repository variable MACOS_RUNNER chooses the Mac. The value is
# JSON: a label list such as ["self-hosted","macOS"], or one quoted
# label such as "xcode-27". A bare xcode-27 fails. It applies only to
# a run that someone starts by hand. With no variable, that run uses a
# GitHub-hosted Mac. Every pull request and every push to main uses a
# GitHub-hosted Mac, also a pull request from a branch of this
# repository or from Dependabot. A pull request runs the workflow files
# of its own branch, so a pull request that edits this file can still
# choose the self-hosted Mac. Only the repository's approval rule for
# fork runs stops that for a fork.
#
# A self-hosted Mac keeps ios/Dependencies, the Swift package .build
# folders and the DerivedData in its tool cache from one run to the
# next. A job-completed hook on that runner that cleans the checkout
# must keep them, as the prepare-xcode-project action does.
# A GitHub-hosted Mac keeps the same folders in the GitHub cache. A pull
# request reads the cache of its own earlier runs, or else the cache of
# main. A pull request cannot read the cache of another pull request.

name: CI

# A pull request run tests the merge of the branch into main, and that
# merge commit is in no event of the later push to main. The run name
# keeps it, so the `changes` job of the push run can find it.
run-name: >-
  ${{ github.event_name == 'pull_request'
  && format('{0} (tests {1})', github.event.pull_request.title, github.sha)
  || '' }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes its older run useless. Every other
# run has a group of its own commit, so each commit on main gets a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A docs-only change cannot break the GameProbe tests or an app build,
  # so those jobs skip. A push to main also skips them when a pull
  # request run already passed on the same source tree. On a push, the
  # Mac jobs run all the same, to save the build data of main.
  #
  # The skip MUST be a job-level `if:`, never a workflow-level
  # `paths-ignore`. The ruleset requires the "CI" context. A workflow
  # that path-filters itself away never reports it, and the PR waits
  # forever for a status that cannot arrive. A job skipped by `if:`
  # still reports, and GitHub counts a skipped job as a success. The
  # summary job runs with `if: always()` and fails only on `failure` or
  # `cancelled`, so a skipped `test` job leaves it green with no edit.
  #
  # The classifier is conservative on purpose. A path that is not
  # documentation counts as code, and any failure to read the file
  # list runs the full gate.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      # JSON for runs-on.
      mac_runner: ${{ github.event_name == 'workflow_dispatch' && vars.MACOS_RUNNER || '"xcode-27"' }}
    steps:
      - name: Classify the changed paths
        id: classify
        # gh and jq ship preinstalled on GitHub-hosted ubuntu runners.
        # The API gives the file list without cloning the repository.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          full_gate() {
            printf '%s\n' "$1"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          }
          skip_gate() {
            printf '%s\n' "$1"
            echo "code=false" >>"$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT" in
            pull_request)
              # The file list stops at 3000 files.
              COUNT=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .changed_files) || COUNT=
              if [ -z "$COUNT" ] || [ "$COUNT" -ge 3000 ]; then
                full_gate "::warning::could not read every changed file: running every job"
              fi
              # A moved file counts at its old path too, so a code file
              # moved into docs/ still runs every job.
              FILES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
                --jq '.[] | .filename, (.previous_filename // empty)') ||
                full_gate "::warning::could not read the changed files: running every job"
              ;;
            push)
              # A squash merge gives main the tree that the pull request
              # run tested when main did not move after that run. The
              # run name holds the merge commit that the run tested.
              TREE=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || TREE=
              PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty') || PR=
              if [ -n "$TREE" ] && [ -n "$PR" ]; then
                HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha) || HEAD_SHA=
                TESTED=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$HEAD_SHA" \
                  --jq '.workflow_runs[].display_title | capture("\\(tests (?<sha>[0-9a-f]{40})\\)$").sha') || TESTED=
                for MERGE in $TESTED; do
                  if [ "$(gh api "repos/$REPO/git/commits/$MERGE" --jq .tree.sha)" = "$TREE" ]; then
                    skip_gate "pull request #$PR passed CI on merge $MERGE, which has the same tree: skipping the test and app jobs"
                  fi
                done
              fi
              case "$BEFORE" in
                "" | 0000000000000000000000000000000000000000)
                  full_gate "no earlier commit to compare with: running every job"
                  ;;
              esac
              # The compare endpoint lists at most 300 files.
              FILES=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
                --jq 'if (.files | length) < 300 then .files[] | .filename, (.previous_filename // empty) else error("too many files") end') ||
                full_gate "::warning::could not read the changed files: running every job"
              ;;
            *)
              full_gate "not a pull request or a push: running every job"
              ;;
          esac
          [ -n "$FILES" ] || full_gate "::warning::the changed file list is empty: running every job"
          printf 'changed files:\n%s\n' "$FILES"
          # The release job writes altstore-source.json to main. No test
          # or build reads it, and the lint job checks its format.
          # Only the Docs workflow builds pages/, landing/ and theme.css.
          CODE=$(printf '%s\n' "$FILES" |
            grep -Ev '\.mdx?$|^docs/media/|^public/|^pages/|^landing/|^theme\.css$|^blume\.config\.ts$|^altstore-source\.json$') || CODE_STATUS=$?
          # grep exits 1 when nothing matches, which is an answer here,
          # not a failure. A status above 1 IS a failure, and its empty
          # output would otherwise read as "no code touched".
          if [ "${CODE_STATUS:-0}" -gt 1 ]; then
            full_gate "::warning::could not classify the changed paths: running every job"
          fi
          if [ -n "$CODE" ]; then
            full_gate "the diff touches code: running every job"
          fi
          skip_gate "the diff is documentation and site files only: skipping the test and app jobs"

  # One job for every lint check, so a run starts one runner for them,
  # not six. Each check step runs when an earlier one failed, so one
  # run reports every failure.
  lint:
    name: Lint
    # SwiftLint's Linux build needs libxml2.so.2, and Ubuntu 26.04 does not
    # have it.
    runs-on: ubuntu-24.04
    defaults:
      run:
        # A named bash shell adds pipefail, so a failed file list fails
        # the check.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: ./.github/actions/setup-swift

      - name: Install shellcheck and yamllint
        # GitHub's Ubuntu image ships both. This runs only when an image
        # update removes one.
        run: |
          if ! command -v shellcheck >/dev/null || ! command -v yamllint >/dev/null; then
            sudo apt-get update && sudo apt-get install -y shellcheck yamllint
          fi

      - name: Install shfmt, SwiftLint and actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          cd "$HOME/.local/bin"
          curl -fsSL --retry 3 -o shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          curl -fsSL --retry 3 -o swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.0/swiftlint_linux_amd64.zip
          curl -fsSL --retry 3 -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256sum --check --strict <<'SUMS'
          fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  shfmt
          79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b  swiftlint.zip
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz
          SUMS
          unzip -q swiftlint.zip swiftlint && rm swiftlint.zip
          tar -xzf actionlint.tar.gz actionlint && rm actionlint.tar.gz
          chmod +x shfmt swiftlint actionlint
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install JS tools
        run: bun install --frozen-lockfile

      - name: Locate sourcekitd for SwiftLint
        # SwiftLint on Linux loads `libsourcekitdInProc.so` from
        # `LINUX_SOURCEKIT_LIB_PATH`. The `swift` binary on PATH is
        # actually swiftly's manager, not the toolchain's swift, so
        # `which swift` doesn't help. Locate the lib directly under
        # `$SWIFTLY_HOME_DIR/toolchains/<version>/usr/lib/`. A
        # preinstalled toolchain has it next to its own `swift`.
        run: |
          if [ -n "${SWIFTLY_HOME_DIR:-}" ]; then
            SK_ROOT="$SWIFTLY_HOME_DIR/toolchains"
          else
            SK_ROOT=$(dirname "$(dirname "$(readlink -f "$(command -v swift)")")")
          fi
          SK_LIB_FILE=$(find "$SK_ROOT" -name 'libsourcekitdInProc.so' 2>/dev/null | head -1)
          if [ -z "$SK_LIB_FILE" ]; then
            echo "::error::libsourcekitdInProc.so not found under $SK_ROOT"
            exit 1
          fi
          SK_LIB=$(dirname "$SK_LIB_FILE")
          echo "Found sourcekitd at $SK_LIB_FILE"
          echo "LINUX_SOURCEKIT_LIB_PATH=$SK_LIB" >> "$GITHUB_ENV"

      - name: swift-format lint
        if: ${{ !cancelled() }}
        # GitHub's Ubuntu image ships Swift without swift-format on PATH.
        # Swift 6 runs the same tool as `swift format`.
        run: scripts/lint-files.sh swift-format | xargs -r swift format lint --strict

      - name: SwiftLint
        if: ${{ !cancelled() }}
        run: |
          scripts/lint-files.sh swiftlint | xargs -r swiftlint lint --strict --reporter github-actions-logging
          # A file on the skip list gets only the rules that stop a crash.
          sed -n 's/^swiftlint //p' scripts/lint-pending.txt |
            xargs -r swiftlint lint --strict --reporter github-actions-logging \
              --only-rule force_cast --only-rule force_try \
              --only-rule force_unwrapping --only-rule implicitly_unwrapped_optional

      - name: clang-format check
        if: ${{ !cancelled() }}
        run: |
          command -v clang-format-18 >/dev/null ||
            { sudo apt-get update && sudo apt-get install -y clang-format-18; }
          scripts/lint-files.sh clang-format | xargs -r clang-format-18 --dry-run --Werror

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: scripts/lint-files.sh shell | xargs -r shellcheck -x

      - name: shfmt check
        if: ${{ !cancelled() }}
        run: scripts/lint-files.sh shell | xargs -r shfmt -d -i 4 -ci

      - name: actionlint
        if: ${{ !cancelled() }}
        run: actionlint

      - name: oxfmt check (YAML + JSON)
        if: ${{ !cancelled() }}
        run: bun run fmt:check

      - name: yamllint
        if: ${{ !cancelled() }}
        # Without --strict, yamllint shows warnings and fails only on errors.
        run: yamllint -c .yamllint.yml ios/Empo/project.yml .github/

      - name: markdownlint
        if: ${{ !cancelled() }}
        run: |
          FILES=$(git ls-files '*.md')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs bun x markdownlint -c .markdownlint.json
          fi

      - name: The CI job needs every job
        if: ${{ !cancelled() }}
        run: bun tools/check-ci-needs.ts

      - name: TypeScript check
        if: ${{ !cancelled() }}
        run: bun x tsc -p .

      - name: Verify pins against empo-deps
        if: ${{ !cancelled() }}
        # Tag-time verification (REQUIRE_PUBLISHED=1) happens in the
        # Release workflow. Here unpublished pins only warn.
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_PUBLISHED: "0"
        run: scripts/verify-empo-deps-pins.sh

  generated:
    name: Generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check the files that GameCore.h generates
        run: bun tools/gamecore/generate.ts --check

  test:
    name: GameProbe (swift test, Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios/GameProbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: ./.github/actions/setup-swift

      # GameProbe's CSQLite target compiles against sqlite3.h. Apple
      # platforms get the header from the SDK. Linux gets it from this
      # package. See ios/GameProbe/Sources/CSQLite/module.modulemap.
      # The self-hosted runners cannot use sudo. Their image ships the
      # package.
      - name: Install SQLite headers
        run: |
          [ -f /usr/include/sqlite3.h ] && exit 0
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # Json5 is not in this list. The package ships to iOS, and the
      # macOS Simulator build job runs it.
      - name: swift test
        working-directory: ${{ github.workspace }}
        run: scripts/run-swift-tests.sh ios/GameProbe

  api:
    name: API (bun test, tsc)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun x tsc -p .

  # The three Mac jobs run at the same time on GitHub-hosted runners.
  # The self-hosted Macs have two runners, so there one job waits. Each
  # job keeps its build data in the runner's tool cache, which no job
  # deletes, so the next run of the job builds only what changed. They
  # run on each push to main, also when the gate skips the other jobs,
  # so main saves the build data that the next pull request reads.
  #
  # macOS is the only runner that can run every check: Linux
  # Foundation has no legacy text encodings. EMPO_TESTS_NO_SKIP=1 turns a skip
  # here into a failure, so a check cannot go missing on both
  # runners at once.
  swift-packages:
    name: Swift package tests (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ${{ fromJSON(needs.changes.outputs.mac_runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          clean: false

      - uses: ./.github/actions/prepare-xcode-project
        with:
          build-data: swift-packages

      - name: Swift package tests, with no skips allowed
        env:
          EMPO_TESTS_NO_SKIP: "1"
        run: scripts/run-swift-tests.sh

  simulator:
    name: Simulator build
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ${{ fromJSON(needs.changes.outputs.mac_runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          clean: false

      - uses: ./.github/actions/prepare-xcode-project
        with:
          build-data: simulator

      # A Simulator of its own for each runner: another job or a person
      # can boot a shared one, and `simctl boot` then fails. The
      # self-hosted runners keep their Simulator for the next run. On a
      # GitHub-hosted runner, the first boot of a new Simulator takes up
      # to 5 minutes, so it starts here and goes on during the build.
      - name: Boot the runner's Simulator
        timeout-minutes: 10
        run: |
          read -r RUNTIME DEVICE_TYPE < <(xcrun simctl list runtimes available -j | jq -r '
            [.runtimes[] | select(.platform == "iOS")] | max_by(.version | split(".") | map(tonumber)) |
            "\(.identifier) \([.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | max_by(.minRuntimeVersion) | .identifier)"')
          NAME="empo-ci-$RUNNER_NAME-${RUNTIME##*.}"
          # Delete this runner's Simulators of older iOS versions. "iOS-"
          # is part of the prefix, so mateo-mac does not delete the
          # Simulators of mateo-mac-2.
          xcrun simctl list devices -j |
            jq -r --arg prefix "empo-ci-$RUNNER_NAME-iOS-" --arg name "$NAME" \
              '.devices[][] | select((.name | startswith($prefix)) and .name != $name) | .udid' |
            while read -r OLD; do xcrun simctl delete "$OLD"; done
          UDID="$(xcrun simctl list devices available -j |
            jq -r --arg name "$NAME" 'first(.devices[][] | select(.name == $name) | .udid) // empty')"
          [ -n "$UDID" ] || UDID="$(xcrun simctl create "$NAME" "$DEVICE_TYPE" "$RUNTIME")"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulator $NAME ($UDID)"
          # `simctl boot` fails on a booted Simulator. It returns before
          # the Simulator is ready, and the start step waits for the rest.
          STATE="$(xcrun simctl list devices -j | jq -r --arg udid "$UDID" '.devices[][] | select(.udid == $udid) | .state')"
          [ "$STATE" = Booted ] || xcrun simctl boot "$UDID"

      - name: Build the app and its tests (iOS Simulator)
        working-directory: ios/Empo
        run: |
          set -o pipefail
          xcodebuild \
            -project Empo.xcodeproj \
            -scheme Empo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            build-for-testing 2>&1 | tail -n 60

      - name: Start the app on the runner's Simulator
        # A Simulator that does not boot holds the runner until this limit.
        timeout-minutes: 10
        env:
          UDID: ${{ env.SIM_UDID }}
        run: |
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Empo.app"
          [ -d "$APP" ] || { echo "::error::$APP not found"; exit 1; }
          # -b boots the Simulator, or only waits when it already runs.
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          # Remove the app and its data, so each run tests a first start.
          xcrun simctl uninstall "$UDID" "$BUNDLE_ID"
          xcrun simctl install "$UDID" "$APP"
          # `simctl launch` prints "<bundle id>: <pid>". A Simulator app
          # is a macOS process, so kill -0 sees it.
          PID="$(xcrun simctl launch "$UDID" "$BUNDLE_ID" | awk '{print $NF}')"
          echo "Empo started as process $PID"
          # The app sends no "ready" signal. A crash at start shows in
          # these seconds.
          sleep 10
          kill -0 "$PID" 2>/dev/null || { echo "::error::Empo stopped within 10 seconds of its start"; exit 1; }
          echo "Empo still runs after 10 seconds"

      # StoreKit reads the test purchase file only when the app starts, and a
      # test run puts the file on the Simulator after that. On a new Simulator,
      # the first run of PlusStoreTests always fails. This run puts the file
      # there. The full run below still fails on a real purchase test failure.
      - name: Load the test purchase file on the Simulator
        working-directory: ios/Empo
        timeout-minutes: 15
        continue-on-error: true
        run: |
          xcodebuild \
            -project Empo.xcodeproj \
            -scheme Empo \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:EmpoTests/PlusStoreTests \
            -collect-test-diagnostics never \
            test-without-building 2>&1 \
            | grep --line-buffered -E "Test Case|Test Suite|error|TEST"

      - name: App tests (iOS Simulator)
        working-directory: ios/Empo
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild \
            -project Empo.xcodeproj \
            -scheme Empo \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            test-without-building 2>&1 | tail -n 200

      - name: Shut down the Simulator
        if: always() && env.SIM_UDID != ''
        run: xcrun simctl shutdown "$SIM_UDID"

  # The release builds the Mac app with the same script. The script
  # starts the signed app and opens each core in Empo Player, so a pull
  # request that stops Mac games from starting fails here.
  mac:
    name: Mac build
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ${{ fromJSON(needs.changes.outputs.mac_runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          clean: false

      - uses: ./.github/actions/prepare-xcode-project
        with:
          build-data: mac

      - name: Build the Mac app and open each core
        run: |
          EMPO_MAC_DERIVED_DATA="$DERIVED_DATA" scripts/package-mac.sh "$(sed -n 's/^ *MARKETING_VERSION: //p' ios/Empo/project.yml)"

  # The repository ruleset waits for the check named "CI", so a rename
  # of this job needs a ruleset change too. GitHub has no way to need
  # every job, so the list names each one, and the Lint job checks it.
  # The list includes `changes`: a failed classifier skips the jobs that
  # need it, and a skipped job counts as a pass.
  ci-summary:
    name: CI
    needs:
      - changes
      - lint
      - generated
      - test
      - api
      - swift-packages
      - simulator
      - mac
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job passed
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
