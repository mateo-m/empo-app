---
# The consolidated PR/main gate: every job that used to live in
# lint.yml, format.yml, test.yml, deps-pins.yml, submodule-guard.yml,
# and build.yml, in one workflow with one trigger block.
#
# The ruleset's required contexts are check-run names, which come from
# JOB names — so the "Lint" and "Format" summary jobs at the bottom
# must keep those exact names. Format's tool set was always a strict
# subset of Lint's running identical commands, so the tools run once
# and both summaries aggregate them.
#
# Requires secret EMPO_DEPS_READ_TOKEN (read access to empo-deps) for
# the native + ANGLE tarballs; the engine-core prebuilt is public.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Several pinned actions (actions/cache, cirruslabs/swiftlint-action,
# awalsh128/cache-apt-pkgs-action) still run on Node.js 20. GitHub is
# forcing all JS actions to Node.js 24; opt in so the deprecation
# banner is silenced. Drop once every pinned action ships Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift (swiftlint + swift-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Cache Swift toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-6.2

      - name: Install Swift toolchain
        # Swiftly is Apple's official toolchain manager. Gives us
        # swift-format on ubuntu-latest without a custom container.
        # On cache hit the action detects the existing toolchain and
        # short-circuits the slow download.
        uses: vapor/swiftly-action@v0.2
        with:
          toolchain: "6.2"

      - name: Locate sourcekitd for SwiftLint
        # SwiftLint on Linux loads `libsourcekitdInProc.so` from
        # `LINUX_SOURCEKIT_LIB_PATH`. The `swift` binary on PATH is
        # actually swiftly's manager, not the toolchain's swift, so
        # `which swift` doesn't help. Locate the lib directly under
        # `$SWIFTLY_HOME_DIR/toolchains/<version>/usr/lib/`.
        run: |
          SK_LIB_FILE=$(find "$SWIFTLY_HOME_DIR/toolchains" -name 'libsourcekitdInProc.so' 2>/dev/null | head -1)
          if [ -z "$SK_LIB_FILE" ]; then
            echo "::error::libsourcekitdInProc.so not found under $SWIFTLY_HOME_DIR"
            exit 1
          fi
          SK_LIB=$(dirname "$SK_LIB_FILE")
          echo "Found sourcekitd at $SK_LIB_FILE"
          echo "LINUX_SOURCEKIT_LIB_PATH=$SK_LIB" >> "$GITHUB_ENV"

      - name: swift-format lint
        # swift-format's lint mode reports the same rule set the
        # formatter would apply, so a clean lint doubles as the
        # format check (this is why Format aggregates this job).
        run: swift-format lint --strict --recursive ios/Empo/src

      - name: SwiftLint
        # cirruslabs action lets us pin the SwiftLint version so it
        # matches what's been validated locally + in `.swiftlint.yml`.
        uses: cirruslabs/swiftlint-action@v1
        with:
          version: 0.63.2
          args: --strict

  objc-cpp:
    name: ObjC / C / C++ (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: clang-format check
        # DoozyX is the canonical clang-format CI action. Pinning
        # clang-format 18 to match local (Apple clang-format 21 is
        # also fine; the shipped .clang-format is style-stable).
        uses: DoozyX/clang-format-lint-action@v0.20
        with:
          source: "ios/Empo/src ios/Empo/shims"
          extensions: "h,m,mm,c,cpp"
          clangFormatVersion: 18

  shell:
    name: Bash (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Cache apt: shellcheck"
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: shellcheck
          version: "1.0"

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: shellcheck
        run: |
          FILES=$(git ls-files 'setup.sh' 'tools/*.sh' 'scripts/*.sh' 'scripts/hooks/*.sh')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs shellcheck
          fi

      - name: shfmt check
        run: |
          FILES=$(git ls-files 'setup.sh' 'tools/*.sh' 'scripts/*.sh' 'scripts/hooks/*.sh')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs shfmt -d -i 4 -ci
          fi

  yaml:
    name: YAML (oxfmt + yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        # Bun's CLI replaces Node + npm. Built-in install cache
        # keyed off bun.lock. Faster install than npm ci.

      - name: Install JS tools
        run: bun install --frozen-lockfile

      - name: "Cache apt: yamllint"
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: yamllint
          version: "1.0"

      - name: oxfmt check (YAML + JSON)
        run: bun run fmt:check

      - name: yamllint
        run: |
          # yamllint warnings shouldn't fail CI; only structural
          # errors should. --strict promotes warnings to failures,
          # so we run twice: first to surface the issues, then
          # `|| true` to keep the soft-warn behaviour.
          yamllint -c .yamllint.yml ios/Empo/project.yml || true
          yamllint --strict -c .yamllint.yml ios/Empo/project.yml \
            || echo "yamllint reported issues (warnings tolerated; failing only on errors)"

  markdown:
    name: Markdown (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install markdownlint-cli
        run: bun install --frozen-lockfile

      - name: markdownlint
        run: |
          # Drive markdownlint from git ls-files so we only scan
          # tracked files. Vendored upstream READMEs and build outputs
          # are skipped because they're already gitignored.
          FILES=$(git ls-files '*.md')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs bun x markdownlint -c .markdownlint.json
          fi

  test:
    name: GameProbe (swift test, Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios/GameProbe
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Cache Swift toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-6.2

      - name: Install Swift toolchain
        uses: vapor/swiftly-action@v0.2
        with:
          toolchain: "6.2"

      - name: swift test
        run: swift test --parallel

  deps-pins:
    name: Verify empo-deps release pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Verify pins against empo-deps
        # gh ships preinstalled on GitHub-hosted ubuntu runners.
        # Tag-time verification (REQUIRE_PUBLISHED=1) happens in the
        # Release workflow; here unpublished pins only warn.
        env:
          GH_TOKEN: ${{ secrets.EMPO_DEPS_READ_TOKEN || github.token }}
          REQUIRE_PUBLISHED: "0"
        run: scripts/verify-empo-deps-pins.sh

  submodule-guard:
    name: mkxp-z submodule points to origin/dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify mkxp-z-apple-mobile pointer is on origin/dev
        run: |
          SUBMODULE_BRANCH=$(git config -f .gitmodules --get submodule.mkxp-z-apple-mobile.branch || echo dev)
          SUBMODULE_URL=$(git config -f .gitmodules --get submodule.mkxp-z-apple-mobile.url)
          case "$SUBMODULE_URL" in
            git@github.com:*) SUBMODULE_URL="https://github.com/${SUBMODULE_URL#git@github.com:}" ;;
            ssh://git@github.com/*) SUBMODULE_URL="https://github.com/${SUBMODULE_URL#ssh://git@github.com/}" ;;
          esac
          SUBMODULE_URL="${SUBMODULE_URL%.git}"
          SUBMODULE_SHA=$(git ls-tree HEAD mkxp-z-apple-mobile | while read -r _ _ sha _; do
            printf '%s' "$sha"
          done)
          if [ -z "$SUBMODULE_SHA" ]; then
            echo "::error::could not resolve mkxp-z-apple-mobile gitlink from parent commit"
            exit 1
          fi
          TMP_REPO=$(mktemp -d)
          git init "$TMP_REPO"
          git -C "$TMP_REPO" remote add origin "$SUBMODULE_URL"
          git -C "$TMP_REPO" fetch --depth 200 origin "$SUBMODULE_BRANCH"
          git -C "$TMP_REPO" fetch --depth 1 origin "$SUBMODULE_SHA" || true
          if ! git -C "$TMP_REPO" merge-base --is-ancestor "$SUBMODULE_SHA" "origin/$SUBMODULE_BRANCH"; then
            echo "::error::mkxp-z-apple-mobile submodule points to $SUBMODULE_SHA, which is not reachable from origin/$SUBMODULE_BRANCH"
            exit 1
          fi

  simulator:
    name: Simulator build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      # Only the engine submodule (plus its nested hmode7) is needed:
      # the app compiles no dependency sources, and the fingerprint
      # checks hash the engine tree. The ios/Dependencies/sources/*
      # submodules are multi-GB and must NOT be checked out here.
      - name: Checkout engine submodule
        run: |
          # -c (not --global) so nothing persists on self-hosted runners.
          git -c url."https://github.com/".insteadOf="git@github.com:" \
              submodule update --init --recursive mkxp-z-apple-mobile

      - name: Select newest Xcode
        # DEVELOPER_DIR instead of xcode-select: no sudo, so the same
        # step works on hosted runners and a self-hosted Mac.
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      # Cache the hydrated prebuilt trees keyed on the three pins.
      # The fetch scripts no-op when the stamp files match, so a cache
      # hit skips the multi-hundred-MB empo-deps download entirely.
      - name: Cache dependency trees
        uses: actions/cache@v4
        with:
          path: |
            ios/Dependencies/build-iphoneos-arm64
            ios/Dependencies/build-iphonesimulator-arm64
            ios/Dependencies/ANGLE/iphoneos
            ios/Dependencies/ANGLE/iphonesimulator
            ios/Dependencies/ANGLE/.fetched-version
            ios/Dependencies/native/.fetched-version
            ios/Dependencies/engine/.fetched-version
          key: deps-${{ runner.os }}-${{ hashFiles('ios/Dependencies/native/.version', 'ios/Dependencies/ANGLE/.version', 'ios/Dependencies/engine/.version') }}

      - name: Hydrate prebuilt dependencies
        env:
          GH_TOKEN: ${{ secrets.EMPO_DEPS_READ_TOKEN }}
        run: |
          set -e
          tools/fetch-angle.sh
          tools/fetch-native-deps.sh
          tools/fetch-engine-prebuilt.sh

      - name: Create empty signing overrides
        # Signing.xcconfig is a gitignored per-machine file (see
        # Signing.xcconfig.example); CI builds unsigned, so empty works.
        run: touch ios/Empo/Signing.xcconfig

      - name: Generate Xcode project
        working-directory: ios/Empo
        run: xcodegen generate --spec project.yml --project . --quiet

      - name: Build (iOS Simulator)
        working-directory: ios/Empo
        run: |
          set -o pipefail
          xcodebuild \
            -project Empo.xcodeproj \
            -scheme Empo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            build 2>&1 | tail -n 60

      # Best-effort boot smoke: install the built app on a simulator
      # and confirm the process survives its first seconds. Depends on
      # the runner image shipping a matching iOS runtime, so failures
      # here don't fail the gate (flip continue-on-error off once this
      # proves stable on the current image).
      - name: Boot smoke test
        continue-on-error: true
        run: |
          set -e
          APP="$(find ios/Empo/DerivedData/Build/Products -name 'Empo.app' -maxdepth 3 | head -n 1)"
          [ -n "$APP" ] || { echo "no Empo.app found"; exit 1; }
          UDID="$(xcrun simctl list devices available --json |
            /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(dev["udid"] for devs in d.values() for dev in devs if dev["isAvailable"]))')"
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" "$APP"
          BUNDLE_ID="$(defaults read "$PWD/$APP/Info" CFBundleIdentifier)"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 10
          xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE_ID" ||
            { echo "app process exited within 10s"; exit 1; }
          echo "boot smoke OK"

  # Aggregate gates whose check-run names match the ruleset's required
  # "Lint" and "Format" contexts exactly. The per-tool jobs above have
  # descriptive names the ruleset does not track one by one. Format
  # aggregates the subset of jobs that verify formatting; the tools
  # run once and feed both summaries.
  lint-summary:
    name: Lint
    needs: [swift, objc-cpp, shell, yaml, markdown]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every lint job passed
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]

  format-summary:
    name: Format
    needs: [swift, objc-cpp, shell, yaml]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every format job passed
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
