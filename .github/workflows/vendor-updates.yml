---
# The libraries in ios/Empo/vendor/ are copies of upstream source, so
# Dependabot cannot see them. Once a month, this compares the pinned
# version in each README with upstream and keeps one open issue up to
# date while an update is available.
name: Vendor updates

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check vendored libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare the pinned versions with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Vendored libraries have updates"
        run: |
          set -euo pipefail
          report=""

          if [ -f ios/Empo/vendor/mimalloc/README.md ]; then
              mi_pin=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' ios/Empo/vendor/mimalloc/README.md | head -1)
              mi_major=${mi_pin%%.*}
              mi_new=$(gh api repos/microsoft/mimalloc/tags --paginate --jq '.[].name' |
                  grep -E "^${mi_major}\.[0-9]+\.[0-9]+$" | sort -V | tail -1)
              if [ "$mi_new" != "$mi_pin" ]; then
                  report+="- mimalloc: $mi_pin is pinned, $mi_new is out (https://github.com/microsoft/mimalloc/releases/tag/$mi_new)"$'\n'
              fi
          fi

          if [ -f ios/Empo/vendor/fishhook/README.md ]; then
              fh_pin=$(grep -oE '[0-9a-f]{40}' ios/Empo/vendor/fishhook/README.md | head -1)
              fh_changed=$(gh api "repos/facebook/fishhook/compare/$fh_pin...main" \
                  --jq '[.files[].filename | select(test("^fishhook\\.[ch]$"))] | length')
              if [ "$fh_changed" != 0 ]; then
                  report+="- fishhook: \`fishhook.c\` or \`fishhook.h\` changed after ${fh_pin:0:7} (https://github.com/facebook/fishhook/compare/$fh_pin...main)"$'\n'
              fi
          fi

          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
              --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -z "$report" ]; then
              echo "every vendored library is up to date"
              exit 0
          fi
          body="${report}"$'\n'"each README in \`ios/Empo/vendor/\` says how to upgrade"
          printf '%s\n' "$body"
          if [ -n "$open" ]; then
              gh issue edit "$open" --body "$body"
          else
              gh issue create --title "$TITLE" --body "$body"
          fi
