---
# A squash merge uses the PR title as the commit subject on main.
# git-cliff drops a subject that is not conventional from the release
# notes. The GitHub "Revert" button gives the title 'Revert "..."',
# which fails here. Change it to "revert: ...".
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title against the commit convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf 'title: %s\n' "$TITLE"
          if printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([^)]+\))?!?: .+'; then
              echo "OK: the title parses as a conventional subject"
          else
              echo "::error::PR titles become squash-merge subjects. Use 'type(scope): subject'."
              exit 1
          fi
