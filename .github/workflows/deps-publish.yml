---
# On-demand CI build + publish of the native dependency toolchain
# (build-iphoneos-arm64 + build-iphonesimulator-arm64 trees) to
# empo-deps, replacing the hand-built-tarball-from-a-laptop flow.
#
# Deliberately workflow_dispatch only: the multi-Ruby cross-builds
# take hours of macOS runner time, and dep bumps are rare. Kick it
# off after changing ios/Dependencies makefiles or dependency
# submodule pins.
#
# Requires secret EMPO_DEPS_PUBLISH_TOKEN: write access to empo-deps
# (contents: read+write on that repo), used to create the release.
# The resulting pin lands as a PR on this repo, so nothing ships
# until the pin change is reviewed and merged.
#
# First-run caveat: the toolchain bootstrap (brew installs below) was
# written from the makefiles' requirements, not a proven CI run —
# adjust as the first execution demands.

name: deps-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "empo-deps release tag (default: native-YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-publish:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Checkout all submodules (shallow)
        run: git submodule update --init --recursive --depth 1

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install build toolchain
        run: brew install automake autoconf libtool cmake pkg-config bison

      - name: Rebuild both dependency trees
        run: scripts/rebuild-all-native-deps.sh

      - name: Package + publish to empo-deps
        env:
          GH_TOKEN: ${{ secrets.EMPO_DEPS_PUBLISH_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || TAG="native-$(date -u +%Y-%m-%d)"
          tools/package-native-deps.sh "$TAG" --publish

      - name: Open pin PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="$(sed -n 's/^NATIVE_DEPS_VERSION=//p' ios/Dependencies/native/.version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="deps/$TAG"
          git checkout -b "$BRANCH"
          git add ios/Dependencies/native/.version
          git commit -m "chore(deps): pin $TAG native prebuilts"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(deps): pin $TAG native prebuilts" \
            --body "CI-built native dependency trees, published to empo-deps as \`$TAG\` by the deps-publish workflow (run ${{ github.run_id }}). Merging flips every clone to the new prebuilts."
