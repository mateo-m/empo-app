---
# On-demand CI build + publish of the native dependency toolchain
# (build-iphoneos-arm64 + build-iphonesimulator-arm64 trees) to
# empo-deps, replacing the hand-built-tarball-from-a-laptop flow.
#
# Deliberately workflow_dispatch only: the multi-Ruby cross-builds
# take hours of macOS runner time, and dep bumps are rare. Kick it
# off after changing ios/Dependencies makefiles or dependency
# submodule pins.
#
# Shape: the two SDK trees build on PARALLEL runners (halving
# wall-clock), then a stitch job verifies, packages, publishes, and
# commits the pin straight to the dispatched branch. Parallelism
# BETWEEN runners is safe. The "sequential, no parallel races" rule
# in the rebuild scripts protects shared state within one checkout,
# and each runner has its own.
#
# Secrets:
#   EMPO_DEPS_READ_TOKEN     read empo-deps (ANGLE headers for mkxp-core)
#   EMPO_DEPS_PUBLISH_TOKEN  write empo-deps (create the release)
#   EMPO_RELEASE_TOKEN       fine-grained PAT (Contents: RW here).
#                            Powers the direct pin commit

name: deps-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "empo-deps release tag (default: native-YYYY-MM-DD)"
        required: false
        default: ""
      runner:
        description: "Where to build (self = your registered Mac, much faster; hosted = GitHub macOS runners)"
        type: choice
        options: [self, hosted]
        default: self

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-tree:
    name: Build ${{ matrix.sdk }} tree
    # Dispatch-only workflow, so routing to a self-hosted Mac is safe:
    # fork PRs can never reach it (build.yml stays hosted-only).
    # "self" queues until the registered Mac runner is online. Pick
    # "hosted" when dispatching while it's offline.
    runs-on: ${{ github.event.inputs.runner == 'hosted' && 'macos-latest' || fromJSON('["self-hosted", "macOS"]') }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Checkout all submodules (shallow)
        run: |
          # -c (not --global) so nothing persists on self-hosted runners.
          git -c url."https://github.com/".insteadOf="git@github.com:" \
              submodule update --init --recursive --depth 1

      - name: Select newest Xcode
        # DEVELOPER_DIR instead of xcode-select: no sudo, so the same
        # step works on hosted runners and a self-hosted Mac.
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      - name: Install build toolchain
        run: brew install automake autoconf libtool cmake pkg-config bison

      - name: Normalize autotools timestamps
        # Fresh clones give sources and their checked-in autotools
        # outputs arbitrary sub-second mtime ordering, so make may
        # decide configure/Makefile.in are stale and regenerate them
        # with whatever automake brew ships, which hard-errors on the
        # version mismatch. We always build from the checked-in
        # generated files, so touch them (in dependency order) to be
        # strictly newer than their inputs. Local machines never hit
        # this because their mtimes are historical.
        run: |
          set -e
          find ios/Dependencies/sources -maxdepth 2 -name aclocal.m4 -exec touch {} +
          sleep 1
          find ios/Dependencies/sources -maxdepth 2 \
            \( -name configure -o -name config.h.in \) -exec touch {} +
          find ios/Dependencies/sources -name Makefile.in -exec touch {} +

      # mkxp-core (built at the end of the rebuild script) compiles
      # against ANGLE headers.
      - name: Hydrate ANGLE prebuilts
        env:
          GH_TOKEN: ${{ secrets.EMPO_DEPS_READ_TOKEN }}
        run: tools/fetch-angle.sh

      - name: Rebuild ${{ matrix.sdk }} tree
        run: scripts/rebuild-${{ matrix.sdk == 'iphoneos' && 'device' || 'simulator' }}-deps.sh

      - name: Pack tree
        run: tar -czf "tree-${{ matrix.sdk }}.tar.gz" -C ios/Dependencies "build-${{ matrix.sdk }}-arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: deps-tree-${{ matrix.sdk }}
          path: tree-${{ matrix.sdk }}.tar.gz

  publish:
    name: Verify, publish, pin
    needs: build-tree
    runs-on: ${{ github.event.inputs.runner == 'hosted' && 'macos-latest' || fromJSON('["self-hosted", "macOS"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      # Fingerprint verification hashes the engine tree.
      - name: Checkout engine submodule
        run: |
          # -c (not --global) so nothing persists on self-hosted runners.
          git -c url."https://github.com/".insteadOf="git@github.com:" \
              submodule update --init --recursive mkxp-z-apple-mobile

      - uses: actions/download-artifact@v4
        with:
          pattern: deps-tree-*
          merge-multiple: true

      - name: Unpack trees
        run: |
          set -e
          tar -xzf tree-iphoneos.tar.gz -C ios/Dependencies
          tar -xzf tree-iphonesimulator.tar.gz -C ios/Dependencies

      - name: Package + publish to empo-deps
        env:
          GH_TOKEN: ${{ secrets.EMPO_DEPS_PUBLISH_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || TAG="native-$(date -u +%Y-%m-%d)"
          tools/package-native-deps.sh "$TAG" --publish

      - name: Push pin commit to the dispatched branch
        # The pin lands on the branch this run was dispatched from,
        # because that branch supplies the submodule commit the trees
        # were built against. Pinning main from a feature branch gave
        # main a pin whose merged objects match a gitlink main does not
        # have, which turned main red (seen 2026-08-09).
        #
        # No PR: commits created with EMPO_RELEASE_TOKEN are
        # GitHub-signed and authored by the token's owner, whose
        # repo-admin role bypasses the ruleset (same mechanism as the
        # Release workflow's sync commit). The expected head is
        # re-read live so a concurrent push fails loudly instead of
        # being clobbered.
        env:
          GH_TOKEN: ${{ secrets.EMPO_RELEASE_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          TAG="$(sed -n 's/^NATIVE_DEPS_VERSION=//p' ios/Dependencies/native/.version)"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::EMPO_RELEASE_TOKEN is not set; commit ios/Dependencies/native/.version (pin $TAG) manually."
            exit 1
          fi
          HEAD="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)"
          base64 < ios/Dependencies/native/.version | tr -d '\n' > /tmp/pin.b64
          gh api graphql \
            -F repo="$GITHUB_REPOSITORY" -F head="$HEAD" -F branch="$BRANCH" \
            -F message="chore(deps): pin $TAG native prebuilts" \
            -F path="ios/Dependencies/native/.version" -F contents=@/tmp/pin.b64 \
            -f query='mutation($repo: String!, $head: GitObjectID!, $branch: String!, $message: String!, $path: String!, $contents: Base64String!) {
              createCommitOnBranch(input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: $message},
                fileChanges: {additions: [{path: $path, contents: $contents}]}
              }) { commit { oid } }
            }' --jq '.data.createCommitOnBranch.commit.oid'
          echo "pinned $TAG on $BRANCH"
